# O docker compose sobe a aplicacao e o banco juntos, com um comando so:
#
#     docker compose up
#
# Os testes rodam na sua maquina, contra a API que subiu aqui:
#
#     pip install -r requirements-dev.txt
#     pytest
#
# Nao precisa criar arquivo nenhum antes: cada configuracao abaixo tem um
# valor padrao, escrito no proprio ${VARIAVEL:-padrao}. Le-se assim:
# "use o que estiver na variavel VARIAVEL; se ela nao existir, use padrao".
#
# O .env continua valendo, e agora e OPCIONAL: se voce criar um (copiando
# o .env.example), o compose le esse arquivo e o que estiver la ganha do
# padrao. E o jeito de trocar uma porta ocupada ou o token, sem editar
# este arquivo.

services:
  api:
    build:
      context: .
      target: api
    ports:
      # Se a porta 3000 ja estiver ocupada na sua maquina, coloque
      # API_PORT=3001 (ou outra livre) no seu .env.
      - "${API_PORT:-3000}:3000"
    environment:
      # Dentro do compose, o banco atende pelo nome "db" — nao por localhost.
      # Por isso esta linha nao tem padrao pra sobrescrever: aqui dentro o
      # endereco do banco e sempre este.
      DATABASE_URL: postgresql+psycopg2://bootcamp:bootcamp@db:5432/bootcamp
      APP_ENV: ${APP_ENV:-local}
      SERVICE_NAME: ${SERVICE_NAME:-bootcamp-library-api}
      # Com "true", todo SQL emitido aparece no log da API. Desligado
      # por padrao: ligado, e uma linha de log por comando.
      DATABASE_ECHO: ${DATABASE_ECHO:-false}
      # A senha que protege os endpoints internos. O padrao vale pra
      # estudar; num sistema de verdade, isso nunca teria valor padrao.
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-default_token}
      # O catalogo de ISBN, o servico de fora que a biblioteca consulta.
      # Variavel que nao esta nesta lista NAO CHEGA no container: o
      # compose repassa o que esta escrito aqui, e mais nada. Sem estas
      # linhas, mexer nos CATALOG_API_* do .env nao teria efeito nenhum
      # aqui dentro.
      #
      # O endereco segue a mesma regra do DATABASE_URL la em cima: aqui
      # dentro, quem faz o papel do catalogo e o mock server, que atende
      # pelo nome "mock". Por isso a linha nao tem padrao pra
      # sobrescrever.
      #
      # O "/catalog" no fim e o prefixo deste servico dentro do mock. Um
      # mock so atende todos os servicos de fora; cada um ganha o seu
      # prefixo, e as expectativas usam o mesmo.
      CATALOG_API_URL: http://mock:1080/catalog
      CATALOG_API_INTERNAL_TOKEN: ${CATALOG_API_INTERNAL_TOKEN:-default_token}
    volumes:
      # Monta o codigo pra dentro do container: salvou o arquivo,
      # a API recarrega sozinha (o --reload ali embaixo).
      - ./src:/app
    # --reload: salvou o arquivo, a API reinicia sozinha.
    command: uvicorn app:app --host 0.0.0.0 --port 3000 --no-server-header --reload
    healthcheck:
      # "Subiu" nao e a mesma coisa que "ja responde". E esta checagem
      # que diz quando a API passa a atender de verdade — espere ela
      # ficar (healthy) antes de rodar o pytest, ou o primeiro teste
      # bate numa porta que ainda nao responde.
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:3000/health_check\")'"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s
    depends_on:
      db:
        condition: service_healthy

  mock:
    # O catalogo de mentira. Ele sobe VAZIO: quem ensina o que
    # ele responde e o proprio teste, antes de chamar a API — veja
    # tests/utils/mock_generator.py.
    #
    # A versao fica fixa de proposito: com "latest", o mock de amanha
    # pode responder diferente do de hoje sem ninguem ter mexido aqui.
    image: mockserver/mockserver:mockserver-5.11.1
    command: -logLevel ERROR -serverPort 1080 -proxyRemotePort 1080
    ports:
      # Os testes rodam na sua maquina e falam com o mock por esta
      # porta: e por ela que eles limpam e ensinam as respostas.
      # MOCK_PORT=1081 (ou outra livre) no seu .env se a 1080 estiver
      # ocupada.
      - "${MOCK_PORT:-1080}:1080"

  db:
    build: ./database/.
    environment:
      POSTGRES_USER: bootcamp
      POSTGRES_PASSWORD: bootcamp
      POSTGRES_DB: bootcamp
    ports:
      # Mesma ideia: DB_PORT=5433 no .env se a 5432 estiver ocupada.
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      # A API so sobe depois que o banco responder de verdade.
      test: ["CMD-SHELL", "pg_isready -U bootcamp -d bootcamp"]
      interval: 3s
      timeout: 3s
      retries: 20

